<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIENDA</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            min-height: 100vh;
            overflow-x: hidden;
            font-family: 'Press Start 2P', monospace;
            position: relative;
        }

        .container {
            width: 100%;
            min-height: 100vh;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== HEADER ===== */
        .header {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 40px 20px;
            position: relative;
            z-index: 10;
        }

        .title {
            font-size: 64px;
            color: #fff;
            text-shadow: 
                4px 4px 0 #ff69b4,
                -2px -2px 0 #ff69b4,
                2px -2px 0 #ff69b4,
                -2px 2px 0 #ff69b4;
            letter-spacing: 8px;
            animation: titlePulse 2s ease-in-out infinite;
        }

        @keyframes titlePulse {
            0%, 100% { text-shadow: 4px 4px 0 #ff69b4, -2px -2px 0 #ff69b4, 2px -2px 0 #ff69b4, -2px 2px 0 #ff69b4; }
            50% { text-shadow: 4px 4px 0 #ffd700, -2px -2px 0 #ffd700, 2px -2px 0 #ffd700, -2px 2px 0 #ffd700; }
        }

        .btn-volver {
            position: absolute;
            right: 40px;
            top: 40px;
            background-color: #ff69b4;
            color: #fff;
            border: none;
            padding: 12px 20px;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            border-radius: 25px;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 3px 3px 0 #c44e8e;
            line-height: 1.6;
            text-align: center;
        }

        .btn-volver:hover {
            background-color: #ffd700;
            transform: scale(1.05);
            box-shadow: 3px 3px 0 #c4a700;
        }

        /* ===== CANDY BAG (top-left) ===== */
        .candy-bag {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 5;
            animation: tiltBag 3s ease-in-out infinite;
        }

        @keyframes tiltBag {
            0%, 100% { transform: rotate(-15deg); }
            50% { transform: rotate(-25deg); }
        }

        .bag-body {
            width: 100px;
            height: 140px;
            background: linear-gradient(135deg, #fff8dc, #ffd700);
            border-radius: 0 0 15px 15px;
            border: 4px solid #c4a700;
            position: relative;
        }

        .bag-top {
            width: 120px;
            height: 20px;
            background: #ffd700;
            border-radius: 30px 30px 0 0;
            border: 4px solid #c4a700;
            position: relative;
            left: -10px;
            top: 0;
        }

        .bag-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 10px;
            color: #c4a700;
            text-align: center;
            line-height: 1.8;
        }

        /* ===== FALLING CANDIES ===== */
        .falling-candies {
            position: absolute;
            top: 100px;
            left: 40px;
            z-index: 4;
        }

        .candy {
            position: absolute;
            border-radius: 50%;
            animation: fallCandy 3s ease-in infinite;
        }

        .candy:nth-child(1) { width: 16px; height: 16px; background: #ff69b4; left: 20px; top: 0; animation-delay: 0s; }
        .candy:nth-child(2) { width: 14px; height: 14px; background: #7cfc00; left: 60px; top: 20px; animation-delay: 0.3s; }
        .candy:nth-child(3) { width: 18px; height: 18px; background: #87ceeb; left: 10px; top: 50px; animation-delay: 0.6s; }
        .candy:nth-child(4) { width: 12px; height: 12px; background: #ffd700; left: 50px; top: 80px; animation-delay: 0.9s; }
        .candy:nth-child(5) { width: 16px; height: 16px; background: #ff4444; left: 30px; top: 30px; animation-delay: 1.2s; }
        .candy:nth-child(6) { width: 14px; height: 14px; background: #7cfc00; left: 70px; top: 60px; animation-delay: 0.2s; }
        .candy:nth-child(7) { width: 16px; height: 16px; background: #ff69b4; left: 80px; top: 90px; animation-delay: 0.5s; }
        .candy:nth-child(8) { width: 12px; height: 12px; background: #87ceeb; left: 90px; top: 40px; animation-delay: 0.8s; }
        .candy:nth-child(9) { width: 18px; height: 18px; background: #ffd700; left: 5px; top: 70px; animation-delay: 1.1s; }
        .candy:nth-child(10) { width: 14px; height: 14px; background: #ff4444; left: 40px; top: 110px; animation-delay: 0.4s; }

        @keyframes fallCandy {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            80% { opacity: 1; }
            100% { transform: translateY(120px) rotate(360deg); opacity: 0; }
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            display: flex;
            justify-content: center;
            align-items: flex-end;
            width: 100%;
            padding: 20px 60px;
            flex: 1;
            gap: 60px;
            position: relative;
            z-index: 10;
        }

        /* ===== GUMMY BEAR LEFT ===== */
        .gummy-bear-left {
            width: 140px;
            height: 180px;
            position: relative;
            animation: bearBounce 2s ease-in-out infinite;
        }

        .gummy-bear-right {
            width: 140px;
            height: 180px;
            position: relative;
            animation: bearBounce 2s ease-in-out infinite 0.5s;
        }

        @keyframes bearBounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* ===== STOREFRONT ===== */
        .storefront {
            position: relative;
            width: 320px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .awning {
            width: 320px;
            height: 50px;
            background: repeating-linear-gradient(
                90deg,
                #ffd700 0px,
                #ffd700 40px,
                #ff8c00 40px,
                #ff8c00 80px
            );
            border-radius: 10px 10px 0 0;
            clip-path: polygon(0 0, 100% 0, 95% 100%, 85% 100%, 75% 0, 65% 0, 55% 100%, 45% 100%, 35% 0, 25% 0, 15% 100%, 5% 100%);
            border: 3px solid #c4a700;
            position: relative;
            z-index: 2;
        }

        .store-sign {
            background: #ffd700;
            color: #000;
            font-size: 12px;
            padding: 8px 20px;
            border-radius: 0 0 10px 10px;
            border: 3px solid #c4a700;
            border-top: none;
            text-align: center;
            margin-top: -5px;
            position: relative;
            z-index: 3;
        }

        .store-body {
            width: 280px;
            height: 140px;
            background: linear-gradient(180deg, #fff5ee, #ffe4c4);
            border: 4px solid #c4a700;
            border-top: none;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        .store-window {
            width: 80px;
            height: 90px;
            background: linear-gradient(135deg, #87ceeb, #b0e0e6);
            border: 4px solid #fff;
            border-radius: 8px 8px 0 0;
            position: relative;
            box-shadow: inset 0 0 15px rgba(135, 206, 235, 0.5);
        }

        .store-window::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 2px;
            background: #fff;
        }

        .store-window::before {
            content: '';
            position: absolute;
            left: 50%;
            top: 0;
            bottom: 0;
            width: 2px;
            background: #fff;
        }

        .store-door {
            width: 70px;
            height: 100px;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            border: 4px solid #c4a700;
            border-radius: 8px 8px 0 0;
            position: relative;
        }

        .door-handle {
            width: 10px;
            height: 10px;
            background: #ffd700;
            border-radius: 50%;
            position: absolute;
            right: 10px;
            top: 50%;
        }

        .store-base {
            width: 280px;
            height: 15px;
            background: #8b4513;
            border: 3px solid #c4a700;
        }

        /* ===== NAV BUTTONS (Right) ===== */
        .nav-buttons {
            display: flex;
            flex-direction: column;
            gap: 25px;
            padding: 20px;
            position: absolute;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 20;
        }

        .nav-btn {
            background: transparent;
            color: #fff;
            border: 3px solid;
            padding: 16px 24px;
            font-family: 'Press Start 2P', monospace;
            font-size: 12px;
            cursor: pointer;
            border-radius: 15px;
            transition: all 0.3s ease;
            text-align: center;
            line-height: 1.8;
            min-width: 260px;
            text-decoration: none;
            display: block;
        }

        .nav-btn:nth-child(1) {
            border-color: #7cfc00;
            color: #7cfc00;
            box-shadow: 4px 4px 0 #3a8c1a, inset 0 0 20px rgba(124, 252, 0, 0.1);
        }
        .nav-btn:nth-child(1):hover {
            background: #7cfc00;
            color: #000;
            box-shadow: 4px 4px 0 #3a8c1a;
        }

        .nav-btn:nth-child(2) {
            border-color: #ff69b4;
            color: #ff69b4;
            box-shadow: 4px 4px 0 #c44e8e, inset 0 0 20px rgba(255, 105, 180, 0.1);
        }
        .nav-btn:nth-child(2):hover {
            background: #ff69b4;
            color: #000;
            box-shadow: 4px 4px 0 #c44e8e;
        }

        .nav-btn:nth-child(3) {
            border-color: #87ceeb;
            color: #87ceeb;
            box-shadow: 4px 4px 0 #4a8ea8, inset 0 0 20px rgba(135, 206, 235, 0.1);
        }
        .nav-btn:nth-child(3):hover {
            background: #87ceeb;
            color: #000;
            box-shadow: 4px 4px 0 #4a8ea8;
        }

        /* ===== BUSHES ===== */
        .bushes {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 12px;
            padding: 0 10px;
            z-index: 8;
        }

        .bush {
            width: 50px;
            height: 30px;
            background: #7cfc00;
            border-radius: 25px 25px 0 0;
            position: relative;
            box-shadow: inset -5px -5px 0 #3a8c1a;
            image-rendering: pixelated;
        }

        .bush::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: -2px;
            right: -2px;
            height: 6px;
            background: #2d6b0f;
            border-radius: 0 0 4px 4px;
        }

        /* ===== SPARKLE EFFECTS ===== */
        .sparkle {
            position: absolute;
            width: 6px;
            height: 6px;
            background: #ffd700;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            animation: sparkle 1.5s ease-in-out infinite;
        }

        .sparkle:nth-child(1) { top: 15%; left: 45%; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 25%; right: 30%; animation-delay: 0.5s; background: #ff69b4; }
        .sparkle:nth-child(3) { top: 10%; left: 55%; animation-delay: 1s; background: #87ceeb; }
        .sparkle:nth-child(4) { top: 35%; left: 35%; animation-delay: 0.3s; }
        .sparkle:nth-child(5) { top: 20%; right: 45%; animation-delay: 0.8s; background: #7cfc00; }

        @keyframes sparkle {
            0%, 100% { transform: scale(0) rotate(0deg); opacity: 0; }
            50% { transform: scale(1.5) rotate(180deg); opacity: 1; }
        }

        /* ===== GUMMY BEAR SVG STYLE ===== */
        .gummy-svg {
            filter: drop-shadow(3px 3px 0 rgba(0,0,0,0.4));
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .title { font-size: 36px; }
            .nav-buttons {
                position: relative;
                right: auto;
                top: auto;
                transform: none;
                flex-direction: row;
                flex-wrap: wrap;
                justify-content: center;
                padding: 10px;
            }
            .nav-btn { min-width: 200px; font-size: 10px; }
            .candy-bag { display: none; }
            .falling-candies { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sparkle Effects -->
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>
        <div class="sparkle"></div>

        <!-- Header -->
        <div class="header">
            <h1 class="title">TIENDA</h1>
            <a href="../index.html" class="btn-volver">VOLVER A LA<br>PÁGINA PRINCIPAL</a>
        </div>

        <!-- Candy Bag -->
        <div class="candy-bag">
            <div class="bag-top"></div>
            <div class="bag-body">
                <div class="bag-label">CANDY<br>BAG</div>
            </div>
        </div>

        <!-- Falling Candies -->
        <div class="falling-candies">
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
            <div class="candy"></div>
        </div>

        <!-- Navigation Buttons (Right) -->
        <div class="nav-buttons">
            <button class="nav-btn" onclick="location.href='#catalogo'">CATÁLOGO DE<br>PRODUCTOS</button>
            <button class="nav-btn" onclick="location.href='#carrito'">CARRITO DE<br>COMPRAS</button>
            <button class="nav-btn" onclick="location.href='#pago'">METODOS DE<br>PAGO</button>
        </div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Gummy Bear Left -->
            <div class="gummy-bear-left">
                <svg class="gummy-svg" viewBox="0 0 140 180" width="140" height="180">
                    <circle cx="30" cy="30" r="18" fill="#ff4444"/>
                    <circle cx="110" cy="30" r="18" fill="#ff4444"/>
                    <circle cx="30" cy="30" r="9" fill="#ff8888"/>
                    <circle cx="110" cy="30" r="9" fill="#ff8888"/>
                    <ellipse cx="70" cy="55" rx="42" ry="38" fill="#ff4444"/>
                    <circle cx="55" cy="48" r="7" fill="#fff"/>
                    <circle cx="85" cy="48" r="7" fill="#fff"/>
                    <circle cx="57" cy="47" r="4" fill="#333"/>
                    <circle cx="87" cy="47" r="4" fill="#333"/>
                    <ellipse cx="70" cy="60" rx="6" ry="4" fill="#ff8888"/>
                    <ellipse cx="70" cy="115" rx="38" ry="42" fill="#ff4444"/>
                    <ellipse cx="70" cy="115" rx="24" ry="28" fill="#ff8888"/>
                    <ellipse cx="25" cy="95" rx="14" ry="22" fill="#ff4444" transform="rotate(-15 25 95)"/>
                    <ellipse cx="115" cy="95" rx="14" ry="22" fill="#ff4444" transform="rotate(15 115 95)"/>
                    <ellipse cx="50" cy="155" rx="16" ry="22" fill="#ff4444"/>
                    <ellipse cx="90" cy="155" rx="16" ry="22" fill="#ff4444"/>
                    <ellipse cx="50" cy="172" rx="12" ry="6" fill="#ff8888"/>
                    <ellipse cx="90" cy="172" rx="12" ry="6" fill="#ff8888"/>
                </svg>
            </div>

            <!-- Storefront -->
            <div class="storefront">
                <div class="awning"></div>
                <div class="store-sign">✦ DULCERÍA ✦</div>
                <div class="store-body">
                    <div class="store-window"></div>
                    <div class="store-door">
                        <div class="door-handle"></div>
                    </div>
                    <div class="store-window"></div>
                </div>
                <div class="store-base"></div>
            </div>

            <!-- Gummy Bear Right -->
            <div class="gummy-bear-right">
                <svg class="gummy-svg" viewBox="0 0 140 180" width="140" height="180">
                    <circle cx="30" cy="30" r="18" fill="#ff4444"/>
                    <circle cx="110" cy="30" r="18" fill="#ff4444"/>
                    <circle cx="30" cy="30" r="9" fill="#ff8888"/>
                    <circle cx="110" cy="30" r="9" fill="#ff8888"/>
                    <ellipse cx="70" cy="55" rx="42" ry="38" fill="#ff4444"/>
                    <circle cx="55" cy="48" r="7" fill="#fff"/>
                    <circle cx="85" cy="48" r="7" fill="#fff"/>
                    <circle cx="57" cy="47" r="4" fill="#333"/>
                    <circle cx="87" cy="47" r="4" fill="#333"/>
                    <ellipse cx="70" cy="60" rx="6" ry="4" fill="#ff8888"/>
                    <ellipse cx="70" cy="115" rx="38" ry="42" fill="#ff4444"/>
                    <ellipse cx="70" cy="115" rx="24" ry="28" fill="#ff8888"/>
                    <ellipse cx="25" cy="95" rx="14" ry="22" fill="#ff4444" transform="rotate(15 25 95)"/>
                    <ellipse cx="115" cy="95" rx="14" ry="22" fill="#ff4444" transform="rotate(-15 115 95)"/>
                    <ellipse cx="50" cy="155" rx="16" ry="22" fill="#ff4444"/>
                    <ellipse cx="90" cy="155" rx="16" ry="22" fill="#ff4444"/>
                    <ellipse cx="50" cy="172" rx="12" ry="6" fill="#ff8888"/>
                    <ellipse cx="90" cy="172" rx="12" ry="6" fill="#ff8888"/>
                </svg>
            </div>
        </div>

        <!-- Bushes at bottom -->
        <div class="bushes">
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
            <div class="bush"></div><div class="bush"></div><div class="bush"></div>
        </div>
    </div>
</body>
</html>
